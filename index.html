<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Voiceover</title>

    <link rel="stylesheet" href="/style.css">

    <script src="/socket.io/socket.io.js"></script>
</head>

<body>

    <!-- =====================================================
         THEME SWITCH
         ===================================================== -->

    <label
        class="theme-switch"
        aria-label="Toggle dark and light mode"
    >
        <input
            type="checkbox"
            id="theme-toggle"
        >

        <span class="slider">
            <span class="slider-icon moon">🌙</span>
            <span class="slider-icon sun">☀️</span>
        </span>
    </label>


    <!-- =====================================================
         JOIN SCREEN
         ===================================================== -->

    <div id="join-screen">

        <div class="card">

            <div class="logo">
                V
            </div>

            <h1>Voiceover</h1>

            <p class="subtitle">
                Simple voice chat.
            </p>


            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    maxlength="32"
                    placeholder="Enter your username"
                    autocomplete="off"
                >

            </div>


            <div class="input-group">

                <label for="channel">
                    Channel ID
                </label>

                <input
                    id="channel"
                    type="text"
                    maxlength="64"
                    placeholder="Enter a channel ID"
                    autocomplete="off"
                >

            </div>


            <button id="join-button">
                Join Channel
            </button>


            <p id="error"></p>

        </div>

    </div>


    <!-- =====================================================
         VOICE SCREEN
         ===================================================== -->

    <div
        id="voice-screen"
        class="hidden"
    >

        <!-- HEADER -->

        <header>

            <div class="header-left">

                <div class="header-logo">
                    V
                </div>

                <div>

                    <h2>
                        Voiceover
                    </h2>

                    <div class="channel-info">
                        Channel:
                        <strong id="channel-name"></strong>
                    </div>

                </div>

            </div>


            <button id="leave-button">
                Leave
            </button>

        </header>


        <!-- MAIN -->

        <main>

            <section class="channel">

                <div class="channel-header">

                    <div>

                        <h3>
                            Voice Channel
                        </h3>

                        <p>
                            People currently connected
                        </p>

                    </div>

                    <div class="connection-status">

                        <span class="connection-dot"></span>

                        Connected

                    </div>

                </div>


                <div id="user-list">
                    <!-- Users appear here -->
                </div>

            </section>

        </main>


        <!-- FOOTER -->

        <footer>

            <button
                id="mute-button"
                class="control-button"
            >
                🎙️
                <span>Mute</span>
            </button>


            <button
                id="deafen-button"
                class="control-button"
            >
                🔊
                <span>Deafen</span>
            </button>

        </footer>

    </div>


    <!-- =====================================================
         REMOTE AUDIO
         ===================================================== -->

    <div id="audio-container"></div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="/app.js"></script>

</body>

</html>
